name: Release

# Builds, signs and publishes the APK of a v* tag from the source of that tag. The source
# and the tag come from the private development repository, one commit per release.
# Signing secrets live in the "release" environment, which only v* tags may use.
#
# The in-app updater installs the release that GitHub calls "latest". A release becomes
# latest only after its signed APK has started on an emulator and the draft carries both
# files: a release that crashes at start could not fix itself over the air.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE: ru.e1173.nookast
  # The certificate of every Nookast release (CN=Nookast). The updater installs a release only
  # when its certificate matches the installed app, so this value never changes.
  RELEASE_CERT_SHA256: 837fd9d7c432b1b0e58e954cf6835689f4fcac15849c76289fea723a66c6c5ad

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      # Actions are pinned to commits: this job holds the signing key.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ "$name" != "$version" ]; then echo "Tag $GITHUB_REF_NAME does not match versionName $name"; exit 1; fi
          if [ ! -s "release-notes/$version.md" ]; then echo "release-notes/$version.md is missing"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # app/build.gradle.kts signs the release variant with .secrets/keystore.properties
      # (gitignored). Values are escaped for the .properties format and never printed.
      - name: Signing key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          umask 077
          mkdir -p .secrets
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > .secrets/release.jks
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            echo 'release.storeFile=release.jks'
            echo "release.storePassword=$(esc "$RELEASE_STORE_PASSWORD")"
            echo "release.keyAlias=$(esc "$RELEASE_KEY_ALIAS")"
            echo "release.keyPassword=$(esc "$RELEASE_KEY_PASSWORD")"
          } > .secrets/keystore.properties

      - name: Tests, lint, release APK
        run: ./gradlew --stacktrace testDebugUnitTest lintVitalRelease assembleRelease

      # Nothing after the build needs the key, so the emulator and publishing steps run without
      # it. The configuration cache holds the signing values too, encrypted.
      - name: Remove the signing key
        if: always()
        run: |
          ./gradlew --stop || true
          rm -rf .secrets .gradle/configuration-cache

      - name: R8 mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mapping-${{ steps.version.outputs.version }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Check the signature
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cert=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | grep -m 1 'certificate SHA-256 digest' | awk '{print $NF}')
          if [ "$cert" != "$RELEASE_CERT_SHA256" ]; then
            echo "The APK is signed by $cert, expected $RELEASE_CERT_SHA256"; exit 1
          fi
          mkdir -p out
          cp "$apk" "out/nookast-$VERSION.apk"
          (cd out && sha256sum "nookast-$VERSION.apk" > "nookast-$VERSION.apk.sha256")
          echo "sha=$(cut -d ' ' -f 1 "out/nookast-$VERSION.apk.sha256")" >> "$GITHUB_OUTPUT"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The very APK that is published: installed, started, alive 15 s later, no fatal exception.
      - name: Start on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          APK: out/nookast-${{ steps.version.outputs.version }}.apk
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: bash .github/scripts/launch-check.sh "$APK"

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.apk.outputs.sha }}
        run: |
          {
            cat "release-notes/$VERSION.md"
            echo
            echo '---'
            echo
            echo "APK SHA-256: \`$SHA\`"
            echo
            echo "Signing certificate SHA-256: \`$RELEASE_CERT_SHA256\`"
          } > out/notes.md
          # A failed earlier run of this tag may have left its draft behind.
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2> /dev/null)" = true ]; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" "out/nookast-$VERSION.apk" "out/nookast-$VERSION.apk.sha256" \
            --verify-tag --draft --title "Nookast $VERSION" --notes-file out/notes.md

      # Draft to latest only with both files in place, then the same check of what the updater reads.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" | jq --arg tag "$GITHUB_REF_NAME" '[.[] | select(.draft and .tag_name == $tag)][0]')
          bash .github/scripts/check-release.sh "$draft" draft
          id=$(jq -r '.id' <<< "$draft")
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -f make_latest=true > /dev/null
          latest=''
          for attempt in 1 2 3 4 5 6; do
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" 2> /dev/null || true)
            if [ "$(jq -r '.tag_name // empty' <<< "$latest")" = "$GITHUB_REF_NAME" ]; then break; fi
            sleep 10
          done
          if ! bash .github/scripts/check-release.sh "$latest" latest; then
            # The updater must not see a release it cannot install: the previous one stays latest.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F prerelease=true > /dev/null
            exit 1
          fi
